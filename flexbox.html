<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        *{
            margin:0;
            box-sizing: border-box;
        }
        .flex1{
            border: solid 0px;
            display: flex;
            flex-direction:row;
            justify-content:space-evenly;
            align-items:center;
            height: 900px;
            width:900px;
            background-color: antiquewhite;
        }
        div div{
            width: 200px;
            box-sizing: border-box;
        }
        .child1{
            min-height: 30px;
        }
        .child2{
            min-height: 70px;
        }
        .child3{
            min-height: 6pc;
        }
        .child4{
            min-height: 200px;
        }
    </style>
</head>
<body>
    <div class="flex1">
        <div class="child1"><img src="https://picsum.photos/150/?random=1" alt="random image"></div>
        <div class="child2"><img src="https://picsum.photos/200/?random=2" alt="random image"></div>
        <div class="child3"><img src="https://picsum.photos/150/?random=3" alt="a random image"></div>
    </div>
    
<a hrec="index.html">go back</a>
</body>
</html>
