<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Arrays and Objects</title>
</head>
<body>
    <script src="data.js"></script>
    <script>
    
        
/**********************************************
Q1. Accessing Object Properties
Print the name of the first student in the array and their History grade.
Your output should look like this:
The name of the first student is: Amina and history grade is: 88
***********************************************************/
let q1 = document.createElement("form");
let q1b = document.createElement("button");
q1.action = "";
q1b.type = "button";
q1b.textContent = "Question 1"

let question1 = function(){
const first =  students[0];
const info = document.createElement("div");
info.textContent = `The name of the first student is: ${first.name} and their history grade is: ${first.grades.history}`
document.body.appendChild(info)
};

q1b.addEventListener("click", question1);

q1.appendChild(q1b);
document.body.appendChild(q1);

/******************************************
Q2. Displaying Student Information
Print the name of each student and their grades for all four courses: Math, English, Science, and History.
Your output should follow this format:
Name: Amina 
            math:85,
            english:92 ,
            science: 78,
            history:88
Name: Carlos 
            math:90,
            english:88 ,
            science: 95,
            history:82
Name: Li Wei 
            math:70,
            english:75 ,
            science: 80,
            history:90
Name: Fatima 
            math:95,
            english:85 ,
            science: 92,
            history:87
Name: John 
            math:60,
            english:70 ,
            science: 68,
            history:65
Name: Sofia 
            math:88,
            english:91 ,
            science: 85,
            history:93
*******************************************/
 let q2 = document.createElement("form");
 let q2b = document.createElement("button");
 q2.action = "";
 q2b.type = "button";
 q2b.textContent = "Question 2"

let question2 = function(){
    for (let student of students){
        const allstudents = document.createElement("p")
        allstudents.textContent = `Name: ${student.name}`
        for (let course of courses){
            allstudents.append(`, ${course}: ${student.grades[course]}`)
        }
        document.body.appendChild(allstudents)
    }
    
}

q2b.addEventListener("click", question2);
 q2.appendChild(q2b);
 document.body.appendChild(q2);

/*************************
Q3. Calculating Student GPAs
Calculate the GPA for each student by finding the average of their grades across all courses. Print each student's name and GPA in the console.
Your output should look like this:

Name = Amina GPA = 85.75
Name = Carlos GPA = 88.75
Name = Li Wei GPA = 78.75
Name = Fatima GPA = 89.75
Name = John GPA = 65.75
Name = Sofia GPA = 89.25
**************************/
 let q3 = document.createElement("form");
 let q3b = document.createElement("button");
 q3.action = "";
 q3b.type = "button";
 q3b.textContent = "Question 3"

let question3 = function(){
        for (let student of students){
            const gpas = document.createElement("div")
        gpas.textContent = `Name: ${student.name}`
        
            let sum = 0;
            for (let grade in student.grades){
                sum += student.grades[grade]
            };
            gpas.append(`, Student grade average: ${sum / 4} `) 
        document.body.appendChild(gpas)
        }

}

q3b.addEventListener("click", question3);
 q3.appendChild(q3b);
 document.body.appendChild(q3);

/******************************************
Q4. Adding a New Student
Add a new student named Nina to the students array with the following information:

name: Nina 
age: 21
grades:
    math: 82
    english: 87 
    science: 90 
    history: 85 

Then, use the array's length property to print the total number of students.
Your output should look like this:
My array has 7 students 

*******************************************/
 let q4 = document.createElement("form");
 let q4b = document.createElement("button");
 q4.action = "";
 q4b.type = "button";
 q4b.textContent = "Question 4"

 let question4 = function(){

    const studentlength = document.createElement("p")

    students.push({name: "Nina",
    age: 21,
    grades:{
        math: 82,
        english: 87,
        science: 90,
        history: 85
 }})
 studentlength.textContent = `This array has ${students.length} students.`
    document.body.appendChild(studentlength)

};


q4b.addEventListener("click", question4);
 q4.appendChild(q4b);
 document.body.appendChild(q4);
/*******************************************
Q5. Adding a New Course
Add a new course named art to each student's grades object.
Then, print the name of each student and the names of all their courses, including Art.
------------------------------------------------------------------------------*/
 let q5 = document.createElement("form");
 let q5b = document.createElement("button");
 q5.action = "";
 q5b.type = "button";
 q5b.textContent = "Question 5";

let question5 = function(){
    
    courses.push("art")

    for (let student of students){
        const studentcourses = document.createElement("div");
        studentcourses.textContent = `Name: ${student.name}`;
        student.grades.art = Math.floor(Math.random()*101);
     for (let course of courses){
        studentcourses.append(`, ${course}: ${student.grades[course]}`)
     }
        document.body.appendChild(studentcourses)
        }
    
}

q5b.addEventListener("click", question5);
 q5.appendChild(q5b);
 document.body.appendChild(q5);

/***************************************
Q6. Finding and Updating a Student
Find the student named John using an appropriate array method. Increase his Math grade by 10 points.
Print John's updated Math grade in the console.
Your output should look like this:
Current Math grade for John = 70
************************************/

 let q6 = document.createElement("form");
 let q6b = document.createElement("button");
 q6.action = "";
 q6b.type = "button";
 q6b.textContent = "Question 6";

let question6 = function(){
    let newoutput = document.createElement("p")
    let findJohn = students[4];
    findJohn.grades.math += 10

    newoutput.textContent = `Current Math Grade for ${findJohn.name} = ${findJohn.grades.math}`
    document.body.appendChild(newoutput)
}

q6b.addEventListener("click", question6);
 q6.appendChild(q6b);
 document.body.appendChild(q6);


/***********************************************
 Q7. Calculating Course Averages
Calculate the average grade for each course across all students. Print the name of each course and its average grade in the console.
**************************************************/
 let q7 = document.createElement("form");
 let q7b = document.createElement("button");
 q7.action = "";
 q7b.type = "button";
 q7b.textContent = "Question 7";

let question7 = function(){
    
        for (let course of courses){
            const courseaverage = document.createElement("div")
            courseaverage.textContent = `Name: ${course}`
        
            let sum = 0;
            for (let student of students){
                sum += student.grades[course]
            };
            courseaverage.append(`, Course average: ${sum / 6} `) 
            document.body.appendChild(courseaverage)
        }

}

q7b.addEventListener("click", question7);
 q7.appendChild(q7b);
 document.body.appendChild(q7);


    </script>
</body>
</html>
